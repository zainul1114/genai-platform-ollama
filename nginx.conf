events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;
        server_name localhost;

        set $oauth2_upstream "http://oauth2-proxy:4180";
        set $keycloak_upstream "http://keycloak:8080";
        set $streamlit_upstream "http://streamlit-bot:8501";
        set $litellm_upstream "http://litellm:4000";
        set $jupyter_upstream "http://jupyterhub:8000";
        set $gitea_upstream "http://gitea:3000";
        set $grafana_upstream "http://grafana:3000";
        set $jaeger_upstream "http://jaeger:16686";

        # Forward crucial headers so Keycloak knows it is behind a proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /oauth2 {
            proxy_pass $oauth2_upstream;
        }

        location /auth {
            proxy_pass $keycloak_upstream;
        }

        location /chat {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;
            proxy_pass $streamlit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /litellm {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;
            proxy_pass $litellm_upstream;
        }

        location /jupyter {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;
            proxy_pass $jupyter_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /gitea {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;
            proxy_pass $gitea_upstream;
        }

        location /grafana {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;
            proxy_pass $grafana_upstream;
        }

        location /jaeger {
            auth_request /oauth2/auth;
            error_page 401 = /oauth2/sign_in;
            proxy_pass $jaeger_upstream;
        }
    }
}
